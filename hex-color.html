<!doctype html>
<html lang="en"><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pick Your Hex</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
        body { font-family: 'DM Sans', sans-serif; }
        .mono { font-family: 'Space Mono', monospace; }
        .swatch {
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }
        .pulse { animation: pulse-ring 0.4s ease-out; }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.4); }
            100% { box-shadow: 0 0 0 20px rgba(255,255,255,0); }
        }
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            cursor: pointer;
            border-radius: 50%;
            overflow: hidden;
        }
        input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
        input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }
    </style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="/_sdk/resizing_sdk.js" type="text/javascript"></script>
 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body data-template-id="__page-root" class="min-h-screen flex items-center justify-center p-6" style="background: linear-gradient(135deg, rgb(15, 12, 41), rgb(48, 43, 99), rgb(36, 36, 62));">
  <main class="w-full max-w-md text-center space-y-8">
   <h1 data-template-id="page-title" class="canva-text font-bold tracking-tight" style="color: rgb(226, 232, 240); font-weight: 700; font-style: normal; font-size: 32px;">Pick Your Hex</h1><!-- Color Preview -->
   <div class="swatch mx-auto w-48 h-48 rounded-3xl shadow-2xl border-4 border-white/20" id="color-swatch" style="background-color: #6C63FF;"></div><!-- Hex Display --> <button id="hex-display" class="mono text-4xl font-bold tracking-wider cursor-pointer hover:scale-105 transition-transform" style="color: #6C63FF;" title="Click to copy" aria-label="Copy hex code"> #6C63FF </button>
   <p data-template-id="copy-hint" class="canva-text text-sm opacity-60" style="color: rgb(148, 163, 184); font-weight: 400; font-style: normal; font-size: 16px;">click hex to copy</p>
   <p id="copy-toast" class="text-sm font-medium opacity-0 transition-opacity duration-300" style="color: #10b981;">Copied!</p><!-- RGB -->
   <p id="rgb-display" class="mono text-sm opacity-70" style="color: #e2e8f0;">rgb(108, 99, 255)</p><!-- Controls -->
   <div class="flex items-center justify-center gap-4"><label class="relative"> <input type="color" id="color-input" value="#6C63FF" class="w-14 h-14 rounded-full shadow-lg"> </label> <button id="eyedropper-btn" class="flex items-center gap-2 px-5 py-3 rounded-full font-medium shadow-lg hover:scale-105 transition-transform" style="background: rgba(255,255,255,0.15); color: #e2e8f0; backdrop-filter: blur(8px);"> <i data-lucide="pipette" style="width:20px;height:20px;"></i> <span data-template-id="dropper-label" class="canva-text" style="color: rgb(226, 232, 240); font-weight: 500; font-style: normal; font-size: 16px;">Pick from screen</span> </button>
   </div>
   <p id="no-support" class="text-xs opacity-50 hidden" style="color:#f87171;">EyeDropper not supported in this browser</p>
  </main>
  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        const swatch = document.getElementById('color-swatch');
        const hexDisplay = document.getElementById('hex-display');
        const rgbDisplay = document.getElementById('rgb-display');
        const colorInput = document.getElementById('color-input');
        const eyedropperBtn = document.getElementById('eyedropper-btn');
        const copyToast = document.getElementById('copy-toast');

        function updateColor(hex) {
            hex = hex.toUpperCase();
            swatch.style.backgroundColor = hex;
            hexDisplay.textContent = hex;
            hexDisplay.style.color = hex;
            colorInput.value = hex;
            const r = parseInt(hex.slice(1,3),16);
            const g = parseInt(hex.slice(3,5),16);
            const b = parseInt(hex.slice(5,7),16);
            rgbDisplay.textContent = `rgb(${r}, ${g}, ${b})`;
            swatch.classList.remove('pulse');
            void swatch.offsetWidth;
            swatch.classList.add('pulse');
        }

        colorInput.addEventListener('input', e => updateColor(e.target.value));

        if (!window.EyeDropper) {
            document.getElementById('no-support').classList.remove('hidden');
        }

        eyedropperBtn.addEventListener('click', async () => {
            if (!window.EyeDropper) return;
            try {
                const result = await new EyeDropper().open();
                updateColor(result.sRGBHex);
            } catch {}
        });

        hexDisplay.addEventListener('click', () => {
            navigator.clipboard.writeText(hexDisplay.textContent).then(() => {
                copyToast.style.opacity = '1';
                setTimeout(() => copyToast.style.opacity = '0', 1500);
            });
        });

        lucide.createIcons();
    </script>

</body></html>
